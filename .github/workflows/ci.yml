name: CI

on:
  push:
  pull_request:

jobs:
  amy-probe-runtime:
    name: AMY probe runtime package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-amy-probe-runtime-${{ runner.os }}-${{ hashFiles('lib/amy-probe-runtime/library.json', 'ci/consumers/amy-probe-runtime/platformio.ini', 'ci/consumers/amy-probe-runtime/src/main.cpp') }}
          restore-keys: |
            platformio-amy-probe-runtime-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Pack AMY probe runtime package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack lib/amy-probe-runtime --output /tmp

      - name: Build AMY probe runtime consumer
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d ci/consumers/amy-probe-runtime
