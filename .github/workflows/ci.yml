name: CI

on:
  push:
  pull_request:

jobs:
  amy-synth-m5:
    name: AMY synth M5 package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out monophonic-instrument package host
        uses: actions/checkout@v6
        with:
          repository: fczuardi/monophonic-instrument
          ref: 9b558750a0a43432705de6d8d31ee8a16f209310
          path: deps/monophonic-instrument

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-amy-synth-m5-${{ runner.os }}-${{ hashFiles('packages/amy-synth-m5/library.json', 'ci/consumers/amy-synth-m5/platformio.ini', 'ci/consumers/amy-synth-m5/src/main.cpp', 'deps/monophonic-instrument/packages/monophonic-instrument/library.json') }}
          restore-keys: |
            platformio-amy-synth-m5-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Pack AMY synth M5 package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack packages/amy-synth-m5 --output /tmp

      - name: Build AMY synth M5 consumer
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d ci/consumers/amy-synth-m5
