name: Publish PlatformIO package

on:
  push:
    tags:
      - "amy-synth-m5-v*"

permissions:
  contents: read

env:
  PLATFORMIO_CORE_DIR: .platformio-home

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Resolve and validate package version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#amy-synth-m5-v}"
          manifest_version="$(python -c 'import json; print(json.load(open("packages/amy-synth-m5/library.json", encoding="utf-8"))["version"])')"

          if [[ "$tag" == "$version" || "$tag" != amy-synth-m5-v* ]]; then
            echo "Unsupported package tag: $tag" >&2
            exit 2
          fi
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag version '$version' does not match manifest version '$manifest_version'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run native package tests
        run: pio test -d packages/amy-synth-m5 -e native

      - name: Pack package
        run: pio pkg pack packages/amy-synth-m5 --output /tmp

      - name: Build isolated consumer
        run: pio run -d ci/consumers/amy-synth-m5

      - name: Publish package to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORMIO_AUTH_TOKEN:-}" ]]; then
            echo "PLATFORMIO_AUTH_TOKEN secret is required." >&2
            exit 1
          fi
          pio pkg publish packages/amy-synth-m5 --type library --no-interactive
