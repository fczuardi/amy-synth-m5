; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stack-core-gray

[env:m5stack-core-gray]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags = 
	-pipe
	-D BLE_MIDI_DEVICE_NAME='"M5 Gray AMY Juno"'
lib_extra_dirs = 
	../../packages
lib_deps = 
	firmware-contracts=file://../../../embedded-music-experiments
	monophonic-instrument=file://../../../monophonic-instrument/packages/monophonic-instrument
	ble-midi-input=file://../../../midi-receiver/packages/ble-midi-input
	m5stack/M5Unified@0.2.17
	amy=https://github.com/shorepine/amy.git#1.2.159
lib_ignore = 
	ArduinoBLE
	Arduino_SpiNINA

; CI checks out this repository without the sibling workspace repositories.
; Use published external packages while continuing to build the local AMY
; package under review.
[env:m5stack-core-gray-ci]
extends = env:m5stack-core-gray
lib_deps =
	fcz2/monophonic-instrument@0.1.5
	fcz2/ble-midi-input@0.4.0
	amy-synth-m5=file://../../packages/amy-synth-m5
	m5stack/M5Unified@0.2.17
	amy=https://github.com/shorepine/amy.git#1.2.159
