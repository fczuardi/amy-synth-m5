[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stack-core-gray

[env:m5stack-core-gray]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter =
  +<main.cpp>
  -<pc_sdl_main.cpp>
  -<pc_amy_platform.c>
build_flags =
  -pipe
lib_extra_dirs =
  ../../packages
  ../../.pio/libdeps/m5stack-core-gray/amy
lib_deps =
  fcz2/monophonic-instrument@0.1.5
  m5stack/M5Unified@0.2.17
  amy=https://github.com/shorepine/amy.git#1.2.159

[env:native-sdl]
platform = native
build_type = debug
extra_scripts = pre:pc_amy_sources.py
build_src_filter =
  +<main.cpp>
  +<pc_sdl_main.cpp>
  +<pc_amy_platform.c>
build_flags =
  -std=c++17
  -DAMY_NATIVE_SDL
  -DAMY_NO_MINIAUDIO
  -I/usr/include/SDL2
  -include SDL.h
  -I src/pc
  -I ../../.pio/libdeps/m5stack-core-gray/amy/src
  -lSDL2
lib_extra_dirs =
  ../../packages
lib_deps =
  amy-synth-m5=file://../../packages/amy-synth-m5
  amy=file://../../.pio/libdeps/m5stack-core-gray/amy
  m5stack/M5Unified@0.2.17
